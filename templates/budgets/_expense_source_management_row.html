<div class="expense-source-management-row{% if is_available %} is-available{% endif %}">
    <form
        class="expense-source-rename-form"
        method="post"
        action="{% url 'expense_source_manage' year=monthly_budget.date.year month=monthly_budget.date.month %}"
        hx-post="{% url 'expense_source_manage' year=monthly_budget.date.year month=monthly_budget.date.month %}"
        hx-target="#modal-content"
    >
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ next }}">
        <input type="hidden" name="action" value="rename">
        <input type="hidden" name="source_id" value="{{ source_row.source.id }}">
        <label class="visually-hidden" for="{{ source_row.rename_form.name.id_for_label }}">
            Rename {{ source_row.source.name }}
        </label>
        {{ source_row.rename_form.name }}
        <button class="button-create" type="submit">Save</button>
        {% for error in source_row.rename_form.name.errors %}
            <p class="field-error-text">{{ error }}</p>
        {% endfor %}
    </form>
    <form
        method="post"
        action="{% url 'expense_source_manage' year=monthly_budget.date.year month=monthly_budget.date.month %}"
        hx-post="{% url 'expense_source_manage' year=monthly_budget.date.year month=monthly_budget.date.month %}"
        hx-target="#modal-content"
    >
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ next }}">
        <input type="hidden" name="action" value="{{ membership_action }}">
        <input type="hidden" name="source_id" value="{{ source_row.source.id }}">
        <button class="{{ membership_button_class }}" type="submit">{{ membership_label }}</button>
    </form>
</div>
