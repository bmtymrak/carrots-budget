<div>
    <h2>Confirm Delete</h2>
    <div class="card-base">
        <div class="data-grid-scroll data-grid-scroll--recurring-delete" role="region" aria-label="Recurring purchase being deleted" tabindex="0">
        <div class="data-grid data-grid--recurring-delete grid-cell-truncate card-table-header">
            <div class="card-table-heading">Item</div>
            <div class="card-table-heading">Amount</div>
            <div class="card-table-heading">Category</div>
            <div class="card-table-heading">Source</div>
            <div class="card-table-heading">Location</div>
        </div>

        <div class="data-grid data-grid--recurring-delete grid-cell-truncate">
            <div>{{recurring_purchase.item}}</div>
            <div>${{recurring_purchase.amount|floatformat:"-2"}}</div>
            <div>{{recurring_purchase.category}}</div>
            <div>{{recurring_purchase.source}}</div>
            <div>{{recurring_purchase.location}}</div>
        </div>
        </div>
    </div>

    <button type="button" hx-delete='{% url "recurring_purchase_delete" pk=recurring_purchase.id %}?next={{next|urlencode}}' class="button-delete button-delete-standalone">Delete</button>
</div>
